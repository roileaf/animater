<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breakable props: break sounds audition</title>
<style>
:root{color-scheme:dark;--bg:#14161a;--panel:#1d2026;--line:#2c313a;--fg:#e6e8eb;--dim:#97a0ad;--keep:#3fb56b;--rej:#d0555f;--acc:#6aa8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,Segoe UI,sans-serif;padding:24px 16px 120px;max-width:980px;margin-inline:auto}
h1{font-size:22px;margin:0 0 4px}p.sub{color:var(--dim);margin:0 0 20px}
h2{font-size:17px;margin:28px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}h2 small{color:var(--dim);font-weight:400}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0}
.row.keep{border-color:var(--keep)}.row.reject{opacity:.5;border-color:var(--rej)}
button{font:inherit;color:var(--fg);background:#262a32;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
.play{width:40px;height:40px;border-radius:50%;padding:0;font-size:16px}.play.on{background:var(--acc);color:#000}
.name{font-weight:600}.meta{color:var(--dim);font-size:13px}.meta a{color:var(--acc)}
.tog{display:flex;gap:6px}.tog button.k.on{background:var(--keep);color:#000;border-color:var(--keep)}.tog button.r.on{background:var(--rej);color:#000;border-color:var(--rej)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#101216;border-top:1px solid var(--line);padding:10px 16px}
.bar .in{max-width:980px;margin:auto;display:flex;gap:8px;align-items:center}
.bar input{flex:1;min-width:0;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:13px ui-monospace,Consolas,monospace}
@media(max-width:560px){.row{grid-template-columns:44px 1fr}.tog{grid-column:1/-1}}
</style></head><body>
<h1>Breakable props: break sounds</h1>
<p class="sub">All CC0 from Freesound, trimmed and loudness-matched per family. Press play, mark each file keep or reject. Choices are remembered in this browser. Copy the summary line at the bottom and paste it back.</p>
<div id="root"></div>
<div class="bar"><div class="in"><input id="sum" readonly aria-label="summary of kept files"><button id="copy">Copy</button><button id="clear" title="Forget all choices">Reset</button></div></div>
<script>
const DATA=[{"f": "wood", "file": "props-break-candidates/wood/barrel-break-66772.ogg", "name": "barrel-break-66772", "len": 1.175, "url": "https://freesound.org/people/kevinkace/sounds/66772/", "title": "Barrel Break 4.wav", "user": "kevinkace", "note": "Single wooden barrel breaking."}, {"f": "wood", "file": "props-break-candidates/wood/crate-break-66780.ogg", "name": "crate-break-66780", "len": 0.712, "url": "https://freesound.org/people/kevinkace/sounds/66780/", "title": "Crate Break 4.wav", "user": "kevinkace", "note": "Wooden crate breaking open."}, {"f": "wood", "file": "props-break-candidates/wood/pallet-break-856631.ogg", "name": "pallet-break-856631", "len": 0.816, "url": "https://freesound.org/people/K-Forces/sounds/856631/", "title": "crate_break4", "user": "K-Forces", "note": "Foley of wooden pallets breaking (planks cracking and splintering)."}, {"f": "glass", "file": "props-break-candidates/glass/bottle-shatter-202093.ogg", "name": "bottle-shatter-202093", "len": 0.852, "url": "https://freesound.org/people/spookymodem/sounds/202093/", "title": "Bottle Shattering.wav", "user": "spookymodem", "note": "Glass bottle shattering."}, {"f": "glass", "file": "props-break-candidates/glass/bottle-smash-199401.ogg", "name": "bottle-smash-199401", "len": 0.942, "url": "https://freesound.org/people/martinimeniscus/sounds/199401/", "title": "Small Bottle Smash FF223.aif", "user": "martinimeniscus", "note": "Liquid-filled beer bottle smashed with a hammer (bright, short)."}, {"f": "glass", "file": "props-break-candidates/glass/bottle-break-212698.ogg", "name": "bottle-break-212698", "len": 0.562, "url": "https://freesound.org/people/dasebr/sounds/212698/", "title": "Breaking a glass bottle", "user": "dasebr", "note": "Glass bottle breaking."}, {"f": "glass", "file": "props-break-candidates/glass/jar-shatter-842519.ogg", "name": "jar-shatter-842519", "len": 0.832, "url": "https://freesound.org/people/Reid.p/sounds/842519/", "title": "Jar Shatter", "user": "Reid.p", "note": "Glass jar of oatmeal dropped on a kitchen floor (duller, with contents)."}, {"f": "clay", "file": "props-break-candidates/clay/pot-smash-810043.ogg", "name": "pot-smash-810043", "len": 1.12, "url": "https://freesound.org/people/anna_bliss/sounds/810043/", "title": "Breaking pot short", "user": "anna_bliss", "note": "Single smash of a ceramic pot."}, {"f": "clay", "file": "props-break-candidates/clay/ceramic-break-623130-a.ogg", "name": "ceramic-break-623130-a", "len": 0.867, "url": "https://freesound.org/people/Brsjak/sounds/623130/", "title": "Ceramic_Break.wav", "user": "Brsjak", "note": "Roof-top ceramics breaking (first event of a multi-event file)."}, {"f": "clay", "file": "props-break-candidates/clay/clay-pottery-399080-a.ogg", "name": "clay-pottery-399080-a", "len": 0.57, "url": "https://freesound.org/people/Kinoton/sounds/399080/", "title": "Clay Pottery Drop ’n’ Break", "user": "Kinoton", "note": "Clay pottery dropped on a concrete floor (one take of several)."}, {"f": "clay", "file": "props-break-candidates/clay/dish-smash-186363-a.ogg", "name": "dish-smash-186363-a", "len": 1.125, "url": "https://freesound.org/people/ragamuffin/sounds/186363/", "title": "pottery-dish-smash-4x-samples.wav", "user": "ragamuffin", "note": "Ceramic dish smashing on a wooden floor (first of four takes)."}, {"f": "clay", "file": "props-break-candidates/clay/ceramic-cup-524999.ogg", "name": "ceramic-cup-524999", "len": 1.2, "url": "https://freesound.org/people/geraldfiebig/sounds/524999/", "title": "ceramic cup shatters on tile floor", "user": "geraldfiebig", "note": "Ceramic cup shattering on a tile floor (tableware, nearest fit for a small pot)."}, {"f": "clay", "file": "props-break-candidates/clay/mug-smash-632337.ogg", "name": "mug-smash-632337", "len": 1.2, "url": "https://freesound.org/people/MordinSolus/sounds/632337/", "title": "Mug smash.wav", "user": "MordinSolus", "note": "Ceramic mug smashing on the floor (tableware, nearest fit for a small pot)."}, {"f": "metal", "file": "props-break-candidates/metal/metal-clang-842171.ogg", "name": "metal-clang-842171", "len": 0.447, "url": "https://freesound.org/people/AardsReal/sounds/842171/", "title": "Basic Metal Clang Free", "user": "AardsReal", "note": "Clean metallic clang of something banging against metal."}, {"f": "metal", "file": "props-break-candidates/metal/pan-clank-741357.ogg", "name": "pan-clank-741357", "len": 0.507, "url": "https://freesound.org/people/Mish7913/sounds/741357/", "title": "Metal Clank (Hitting the Lid of the Pan)", "user": "Mish7913", "note": "Metal pan lid clank."}, {"f": "metal", "file": "props-break-candidates/metal/metal-barrel-795432-a.ogg", "name": "metal-barrel-795432-a", "len": 0.647, "url": "https://freesound.org/people/rtyrtyrtyrtyrtyrtyrtyrty/sounds/795432/", "title": "Metal Barrel Hit", "user": "rtyrtyrtyrtyrtyrtyrtyrty", "note": "Hit on a metal barrel (made with a half-full can, subtle)."}, {"f": "stone", "file": "props-break-candidates/stone/rock-crumble-391919.ogg", "name": "rock-crumble-391919", "len": 1.2, "url": "https://freesound.org/people/Trancox/sounds/391919/", "title": "PiedraDesmoronandose.wav", "user": "Trancox", "note": "Rock crumbling (a hit then falling pieces)."}, {"f": "stone", "file": "props-break-candidates/stone/stone-crumble-521956.ogg", "name": "stone-crumble-521956", "len": 1.2, "url": "https://freesound.org/people/Kastenfrosch/sounds/521956/", "title": "Stone Crumble 2", "user": "Kastenfrosch", "note": "Small stones crumbling and trickling (soft, quiet source)."}, {"f": "stone", "file": "props-break-candidates/stone/rocks-tumble-389618.ogg", "name": "rocks-tumble-389618", "len": 1.15, "url": "https://freesound.org/people/_stubb/sounds/389618/", "title": "Rock Tumble 2.wav", "user": "_stubb", "note": "Rocks falling together on concrete."}, {"f": "stone", "file": "props-break-candidates/stone/stone-impact-513694.ogg", "name": "stone-impact-513694", "len": 0.617, "url": "https://freesound.org/people/kasparsj/sounds/513694/", "title": "impact-stone-heavy.wav", "user": "kasparsj", "note": "Heavy stone thrown on the ground (an impact, not a crack)."}, {"f": "stone", "file": "props-break-candidates/stone/stone-rubble-569510.ogg", "name": "stone-rubble-569510", "len": 0.447, "url": "https://freesound.org/people/Sheyvan/sounds/569510/", "title": "Stone Impact Rubble Debris 14", "user": "Sheyvan", "note": "Stone impact on rubble (short)."}, {"f": "stone", "file": "props-break-candidates/stone/rock-drop-746473.ogg", "name": "rock-drop-746473", "len": 0.553, "url": "https://freesound.org/people/OutbreakProtocol/sounds/746473/", "title": "Dropping Rock 1", "user": "OutbreakProtocol", "note": "Rock dropped, with a few bounces."}, {"f": "stone", "file": "props-break-candidates/stone/small-rocks-576108.ogg", "name": "small-rocks-576108", "len": 1.095, "url": "https://freesound.org/people/Tim_Verberne/sounds/576108/", "title": "S_O_1_Rocks_Falling_05.wav", "user": "Tim_Verberne", "note": "Small rocks hitting the ground."}, {"f": "splash", "file": "props-break-candidates/splash/bucket-splash-195955.ogg", "name": "bucket-splash-195955", "len": 0.447, "url": "https://freesound.org/people/minian89/sounds/195955/", "title": "bucket_splash.mp3", "user": "minian89", "note": "Liquid thrown at close range from a bucket."}, {"f": "splash", "file": "props-break-candidates/splash/bucket-empty-418417.ogg", "name": "bucket-empty-418417", "len": 1.2, "url": "https://freesound.org/people/wormer2/sounds/418417/", "title": "Water splash, emptying a bucket 9", "user": "wormer2", "note": "Bucket of water emptied in a bathroom."}, {"f": "splash", "file": "props-break-candidates/splash/water-splash-186748.ogg", "name": "water-splash-186748", "len": 0.447, "url": "https://freesound.org/people/rombart/sounds/186748/", "title": "Splash-eau-goudron1.wav", "user": "rombart", "note": "Close-miked water splash, denoised."}, {"f": "splash", "file": "props-break-candidates/splash/bucket-throw-693570.ogg", "name": "bucket-throw-693570", "len": 1.2, "url": "https://freesound.org/people/jbregler/sounds/693570/", "title": "Small Bucket of Water.m4a", "user": "jbregler", "note": "Small bucket of water thrown (splash)."}, {"f": "metal", "file": "props-break-candidates/metal/metal-bucket-641245.ogg", "name": "metal-bucket-641245", "len": 0.837, "url": "https://freesound.org/people/CaptainYulef/sounds/641245/", "title": "metal-bucket.wav", "user": "CaptainYulef", "note": "Metal bucket impact."}, {"f": "metal", "file": "props-break-candidates/metal/anvil-270589.ogg", "name": "anvil-270589", "len": 0.447, "url": "https://freesound.org/people/michorvath/sounds/270589/", "title": "Anvil Hit 1", "user": "michorvath", "note": "Anvil struck by a metal hammer."}, {"f": "metal", "file": "props-break-candidates/metal/metal-clang-686649.ogg", "name": "metal-clang-686649", "len": 0.447, "url": "https://freesound.org/people/ominouswhoosh/sounds/686649/", "title": "Clang", "user": "ominouswhoosh", "note": "Metal dropped on concrete, short clang."}, {"f": "metal", "file": "props-break-candidates/metal/tin-pan-257938.ogg", "name": "tin-pan-257938", "len": 0.567, "url": "https://freesound.org/people/Kane53126/sounds/257938/", "title": "Tin Pan Hit.wav", "user": "Kane53126", "note": "Tin pan hit."}, {"f": "wood", "file": "props-break-candidates/wood/barrel-break-66769.ogg", "name": "barrel-break-66769", "len": 1.2, "url": "https://freesound.org/people/kevinkace/sounds/66769/", "title": "Barrel Break 1.wav", "user": "kevinkace", "note": "Single wooden barrel breaking."}, {"f": "wood", "file": "props-break-candidates/wood/barrel-break-66770.ogg", "name": "barrel-break-66770", "len": 1.03, "url": "https://freesound.org/people/kevinkace/sounds/66770/", "title": "Barrel Break 2.wav", "user": "kevinkace", "note": "Single wooden barrel breaking."}, {"f": "wood", "file": "props-break-candidates/wood/barrel-break-66771.ogg", "name": "barrel-break-66771", "len": 1.15, "url": "https://freesound.org/people/kevinkace/sounds/66771/", "title": "Barrel Break 3.wav", "user": "kevinkace", "note": "Single wooden barrel breaking."}, {"f": "wood", "file": "props-break-candidates/wood/crate-break-66777.ogg", "name": "crate-break-66777", "len": 0.697, "url": "https://freesound.org/people/kevinkace/sounds/66777/", "title": "Crate Break 1.wav", "user": "kevinkace", "note": "Wooden crate breaking open."}, {"f": "wood", "file": "props-break-candidates/wood/crate-break-66778.ogg", "name": "crate-break-66778", "len": 0.687, "url": "https://freesound.org/people/kevinkace/sounds/66778/", "title": "Crate Break 2.wav", "user": "kevinkace", "note": "Wooden crate breaking open."}, {"f": "wood", "file": "props-break-candidates/wood/crate-break-66779.ogg", "name": "crate-break-66779", "len": 0.682, "url": "https://freesound.org/people/kevinkace/sounds/66779/", "title": "Crate Break 3.wav", "user": "kevinkace", "note": "Wooden crate breaking open."}];
const FAMS=[["wood", "Wood (barrel, crate, planks)"], ["glass", "Glass (bottle, jar)"], ["clay", "Clay and ceramic (pot, jar)"], ["metal", "Metal (clang, struck, dropped)"], ["stone", "Stone (crack, crumble, rubble)"], ["splash", "Liquid splash (contents hitting the floor)"]];
const KEY="animater.props-break-audition.v1";
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const audio=new Audio();let cur=null;
audio.addEventListener("ended",()=>{if(cur)cur.classList.remove("on");cur=null});
const root=document.getElementById("root");
for(const [f,label] of FAMS){
  const items=DATA.filter(d=>d.f===f);
  const h=document.createElement("h2");h.innerHTML=label+" <small>"+items.length+" candidates</small>";root.append(h);
  for(const d of items){
    const row=document.createElement("div");row.className="row";row.dataset.file=d.f+"/"+d.name+".ogg";
    row.innerHTML='<button class="play" aria-label="Play">&#9654;</button><div><div class="name"></div><div class="meta"></div></div><div class="tog"><button class="k">Keep</button><button class="r">Reject</button></div>';
    row.querySelector(".name").textContent=d.name+".ogg";
    const m=row.querySelector(".meta");m.append(d.len.toFixed(2)+" s · "+d.note+" · ");
    const a=document.createElement("a");a.href=d.url;a.target="_blank";a.rel="noopener";a.textContent=d.title+" by "+d.user;m.append(a);
    const pb=row.querySelector(".play");
    pb.onclick=()=>{
      if(cur===pb){audio.pause();pb.classList.remove("on");cur=null;return}
      if(cur)cur.classList.remove("on");
      audio.src=d.file;audio.currentTime=0;audio.play().catch(()=>{});pb.classList.add("on");cur=pb;
    };
    const set=v=>{if(st[row.dataset.file]===v)delete st[row.dataset.file];else st[row.dataset.file]=v;save();paint()};
    row.querySelector(".k").onclick=()=>set("keep");
    row.querySelector(".r").onclick=()=>set("reject");
    root.append(row);
  }
}
function paint(){
  const kept=[],rej=[];
  document.querySelectorAll(".row").forEach(r=>{
    const v=st[r.dataset.file];
    r.classList.toggle("keep",v==="keep");r.classList.toggle("reject",v==="reject");
    r.querySelector(".k").classList.toggle("on",v==="keep");r.querySelector(".r").classList.toggle("on",v==="reject");
    if(v==="keep")kept.push(r.dataset.file);if(v==="reject")rej.push(r.dataset.file);
  });
  const per=FAMS.map(([f])=>{const k=kept.filter(x=>x.startsWith(f+"/")).map(x=>x.slice(f.length+1));return f+": "+(k.length?k.join(", "):"-")});
  document.getElementById("sum").value="KEEP "+kept.length+" | "+per.join(" | ")+(rej.length?" | REJECT "+rej.length+": "+rej.join(", "):"");
}
document.getElementById("copy").onclick=async()=>{const i=document.getElementById("sum");try{await navigator.clipboard.writeText(i.value)}catch(e){i.select();document.execCommand("copy")}};
document.getElementById("clear").onclick=()=>{if(confirm("Forget all keep/reject choices?")){st={};save();paint()}};
paint();
</script></body></html>
