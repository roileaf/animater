<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Room Smoke</title>
<style>body { margin: 0; background: #111; font: 14px/1.5 system-ui, sans-serif; color: #ddd; } canvas { display: block; } p { margin: 8px 12px; }</style>
</head>
<body>
<script type="module">
// Check, not shipped: the module's own room smoke (smokePuffs + createSmokeLooks), filling two rooms the module's own
// round really worked out (smokeRoundPlan), round by round, drifting between rounds exactly as it does in play.
// The clock here stands in for the server's, which the module has injected; nothing in the module reads one.
import * as PIXI from '/preview-pixi.mjs';
import { createSmokeLooks, smokePuffs, smokeSeedOf } from '/modules/animater/scripts/engines/props/smoke-look.mjs';
import { smokeRoundPlan } from '/modules/animater/scripts/engines/props/smoke-round.mjs';
import { smokeOpeningsOf, THICK, THIN } from '/modules/animater/scripts/engines/props/smoke-field.mjs';

const CELL = 70, COLS = 20, ROWS = 9, W = COLS * CELL, H = ROWS * CELL;
const app = new PIXI.Application({ width: W, height: H, background: 0x2b2a26, preserveDrawingBuffer: true, antialias: true });
document.body.append(app.view); globalThis.__PIXI_APP__ = app;

// Two rooms side by side on one grid: a sealed 5x5 on the left (columns 1-5), and an inn on the right whose taproom
// (columns 11-12) and back room (columns 13-15) share one open inside door in row 3.
const left = (i) => { const c = i % COLS, r = (i - c) / COLS; return c >= 1 && c <= 5 && r >= 1 && r <= 5; };
const right = (i) => { const c = i % COLS, r = (i - c) / COLS; return c >= 11 && c <= 15 && r >= 1 && r <= 5; };
const inRoom = (i) => left(i) || right(i);
const DOOR = [3 * COLS + 12, 3 * COLS + 13];
const walled = (i, n) => {
  if (inRoom(i) !== inRoom(n)) return true;
  if (left(i) !== left(n)) return true;
  const ci = i % COLS, cn = n % COLS;
  if (Math.min(ci, cn) === 12 && Math.max(ci, cn) === 13) return !(DOOR.includes(i) && DOOR.includes(n));
  return false;
};
const openings = smokeOpeningsOf({ walls: [{ c: [13 * CELL, 3 * CELL, 13 * CELL, 4 * CELL], door: 1, ds: 1 }], grid: CELL, cell: CELL, origin: { x: 0, y: 0 }, cols: COLS, rows: ROWS, indoors: inRoom });
const sources = [{ i: 3 * COLS + 3, rate: 1, levels: [] }, { i: 3 * COLS + 11, rate: 1, levels: [] }];
const sceneOf = (smoke) => ({ id: 'preview00000000z', dimensions: { width: W, height: H, size: CELL }, levels: [],
  flags: { animater: { smokeFills: true, ...(smoke ? { smoke, smokeGrid: { cols: COLS, cell: CELL } } : {}) } } });

// The painted room: stepped floor, ink walls — the battlemap look the smoke has to sit on.
const floor = new PIXI.Graphics();
for (let i = 0; i < COLS * ROWS; i++) {
  const x = (i % COLS) * CELL, y = Math.floor(i / COLS) * CELL;
  floor.beginFill(inRoom(i) ? 0x4a4036 : 0x33302b).drawRect(x, y, CELL, CELL).endFill();
  floor.lineStyle(1, 0x1b1812, 0.35).drawRect(x, y, CELL, CELL).lineStyle(0);
}
for (let i = 0; i < COLS * ROWS; i++) for (const [dc, dr] of [[1, 0], [0, 1]]) {
  const c = i % COLS, r = Math.floor(i / COLS), n = (r + dr) * COLS + (c + dc);
  if (c + dc >= COLS || r + dr >= ROWS || !walled(i, n)) continue;
  floor.lineStyle(4, 0x151109, 0.9);
  if (dc) floor.moveTo((c + 1) * CELL, r * CELL).lineTo((c + 1) * CELL, (r + 1) * CELL);
  else floor.moveTo(c * CELL, (r + 1) * CELL).lineTo((c + 1) * CELL, (r + 1) * CELL);
  floor.lineStyle(0);
}
app.stage.addChild(floor);
// Stand-ins for creatures, so it is plain that thick smoke is painted OVER them: that is what layer 752 is for.
const folk = new PIXI.Graphics();
for (const i of [2 * COLS + 2, 4 * COLS + 5, 2 * COLS + 14, 4 * COLS + 12]) {
  const x = (i % COLS) * CELL + CELL / 2, y = Math.floor(i / COLS) * CELL + CELL / 2;
  folk.beginFill(0xc8a46a).drawCircle(x, y, CELL * 0.3).endFill();
  folk.lineStyle(2, 0x1b1410, 0.8).drawCircle(x, y, CELL * 0.3).lineStyle(0);
}
app.stage.addChild(folk);

const cloud = new PIXI.Container(); app.stage.addChild(cloud);
const looks = createSmokeLooks({ PIXI, layer: () => cloud, grid: () => CELL, now: () => performance.now() });

const text = new PIXI.Text('', { fill: 0xffffff, fontSize: 14, fontWeight: '600', stroke: 0x000000, strokeThickness: 3 });
text.position.set(10, 8); app.stage.addChild(text);

let smoke = null, round = 0, dying = false;
const step = () => {
  const plan = smokeRoundPlan({ activeGM: true, on: true, scene: sceneOf(smoke), sources: dying ? [] : sources,
    indoors: inRoom, walled, openings, roomOf: () => ({ id: 'room', size: 25 }) });
  smoke = Object.fromEntries((plan?.cells ?? []).map((c) => [String(c.i), Math.round(c.v * 10000) / 10000]));
  round += 1;
  if (round === 20) dying = true;            // the fire is put out, and the room starts to clear
  if (!Object.keys(smoke).length && dying) { round = 0; dying = false; smoke = null; }
  const cells = Object.entries(smoke).map(([i, v]) => ({ i: Number(i), v }));
  const thick = cells.filter((c) => c.v >= THICK).length, thin = cells.filter((c) => c.v >= THIN && c.v < THICK).length;
  text.text = `round ${round}${dying ? ' — the fire is out, the room is clearing' : ''}   ${thick} thick (blocks sight), ${thin} thin (conceals)`;
  looks.sync({ puffs: smokePuffs(cells, { cols: COLS, origin: { x: 0, y: 0 }, cell: CELL, seed: smokeSeedOf('preview00000000z') }) });
};
step();
// A round is six seconds in play; here it is three, so the drift between rounds is easy to watch.
setInterval(step, 3000);
</script>
<p>Left: a sealed 5&times;5 room. Right: an inn whose taproom and back room share one open inside door. The round runs
every three seconds (six in play); the fire is put out at round 20 and the rooms clear. The cloud drifts and sways
between rounds — but what blocks sight does not move until the round does.</p>
</body>
</html>
